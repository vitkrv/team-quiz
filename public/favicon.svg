<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Cortex Rush</title>
  <defs>
    <linearGradient id="cortex" x1="10" y1="23" x2="29" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc" />
      <stop offset="1" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="rush" x1="36" y1="23" x2="54" y2="53" gradientUnits="userSpaceOnUse">
