    <path transform="translate(-1 -6) scale(.8 1)" d="M29 24H18C11 24 8 29 8 38v1c0 9 3 14 10 14h11v-8H19c-3 0-3-2-3-7s0-6 3-6h10z" fill="url(#cortex)" />
