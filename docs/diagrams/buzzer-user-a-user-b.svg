<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc"><title id="title">User A and User B buzz timing example</title><desc id="desc">Both buttons unlock at time zero. A presses after half a second and commits at two seconds. B presses after one second and commits first at 1.2 seconds, creating a deadline of 3.2 seconds. Both are accepted. A wins because the half-second reaction is smaller.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#94a3b8"/></marker></defs><rect width="1100" height="820" rx="20" fill="#0f172a"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="48" fill="#f8fafc" font-size="28" font-weight="700">Example: User A wins even though B commits first</text><text x="40" y="78" fill="#cbd5e1" font-size="17" font-weight="400">Illustrative times • both buttons become available at t = 0 • no penalties</text><rect x="40" y="110" width="490" height="100" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="62" y="142" fill="#38bdf8" font-size="20" font-weight="700">User A • 0.5-second reaction</text><text x="62" y="171" fill="#cbd5e1" font-size="17" font-weight="400">Press at 0.5s → commit at 2.0s</text><text x="62" y="196" fill="#cbd5e1" font-size="17" font-weight="400">A’s captured press is still in flight when B commits.</text><rect x="550" y="110" width="510" height="100" rx="14" fill="#1e293b" stroke="#c4b5fd" stroke-width="1.5"/><text x="572" y="142" fill="#c4b5fd" font-size="20" font-weight="700">User B • 1.0-second reaction</text><text x="572" y="171" fill="#cbd5e1" font-size="17" font-weight="400">Press at 1.0s → commit at 1.2s</text><text x="572" y="196" fill="#cbd5e1" font-size="17" font-weight="400">B’s commit starts collection; deadline = 3.2s.</text><rect x="484" y="245" width="490" height="280" rx="10" fill="#164e63" opacity="0.45"/><text x="499" y="273" fill="#67e8f9" font-size="18" font-weight="700">2-second collection window</text><path d="M190 290 V525" stroke="#475569" stroke-dasharray="4 6"/><text x="178" y="552" fill="#cbd5e1" font-size="15" font-weight="400">0s</text><path d="M312.5 290 V525" stroke="#475569" stroke-dasharray="4 6"/><text x="300.5" y="552" fill="#cbd5e1" font-size="15" font-weight="400">0.5s</text><path d="M435 290 V525" stroke="#475569" stroke-dasharray="4 6"/><text x="423" y="552" fill="#cbd5e1" font-size="15" font-weight="400">1s</text><path d="M484 290 V525" stroke="#475569" stroke-dasharray="4 6"/><text x="472" y="552" fill="#cbd5e1" font-size="15" font-weight="400">1.2s</text><path d="M680 290 V525" stroke="#475569" stroke-dasharray="4 6"/><text x="668" y="552" fill="#cbd5e1" font-size="15" font-weight="400">2s</text><path d="M974 290 V525" stroke="#475569" stroke-dasharray="4 6"/><text x="962" y="552" fill="#cbd5e1" font-size="15" font-weight="400">3.2s</text><text x="40" y="336" fill="#38bdf8" font-size="21" font-weight="700">User A</text><text x="40" y="446" fill="#c4b5fd" font-size="21" font-weight="700">User B</text><path d="M190 350 L1035.25 350" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M190 460 L1035.25 460" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><circle cx="312.5" cy="350" r="7" fill="#38bdf8"/><text x="270.5" y="324" fill="#38bdf8" font-size="17" font-weight="600">Press · 0.5s</text><circle cx="680" cy="350" r="7" fill="#38bdf8"/><text x="638" y="389" fill="#38bdf8" font-size="17" font-weight="600">Commit · 2.0s</text><circle cx="435" cy="460" r="7" fill="#c4b5fd"/><text x="393" y="430" fill="#c4b5fd" font-size="17" font-weight="600">Press · 1.0s</text><circle cx="484" cy="460" r="7" fill="#c4b5fd"/><text x="442" y="500" fill="#c4b5fd" font-size="17" font-weight="600">Commit · 1.2s</text><path d="M974 280 V525" stroke="#fda4af" stroke-width="2"/><text x="936" y="580" fill="#fda4af" font-size="16" font-weight="700">Deadline</text><text x="178" y="580" fill="#cbd5e1" font-size="16" font-weight="400">Unlock</text><rect x="40" y="610" width="1020" height="110" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/><text x="62" y="642" fill="#34d399" font-size="20" font-weight="700">After 3.2s: host finalizes → A wins</text><text x="62" y="671" fill="#cbd5e1" font-size="17" font-weight="400">Both submissions committed before the deadline. Compare reactions: 0.5s &lt; 1.0s.</text><text x="62" y="696" fill="#cbd5e1" font-size="17" font-weight="400">Reported reaction gap: 0.5s. No network-latency estimate is subtracted.</text><text x="40" y="756" fill="#fda4af" font-size="18" font-weight="400">If A committed at 3.2s or later, A would be rejected and B would win this two-player race.</text><text x="40" y="789" fill="#94a3b8" font-size="17" font-weight="400">Both presses were captured before either client observed collection; fresh input then closes.</text></g></svg>
