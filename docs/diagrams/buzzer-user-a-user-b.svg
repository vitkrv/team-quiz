<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1010" viewBox="0 0 1100 1010" role="img" aria-labelledby="title desc">
  <title id="title">Late-loading User A wins during collection</title>
  <desc id="desc">User B unlocks at zero, presses at one second, and commits at 1.2 seconds. This fixes the server deadline at 3.2 seconds. User A loads late and unlocks at 1.8 seconds during collection, presses at 2 seconds with a 0.2 second reaction, and commits at 2.2 seconds. Both are accepted, so A wins. A separate example shows local grace from 2.8 to 3.8 seconds cannot admit a commit at or after 3.2 seconds and ends immediately when the winner is announced.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1100" height="1010" rx="20" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
  <text x="40" y="48" fill="#f8fafc" font-size="30" font-weight="700">Example: a late-loading player can still win</text>
  <text x="40" y="78" fill="#cbd5e1" font-size="17">Illustrative times after the initial opening delay • no penalties • buzzer policy v1</text>
  <rect x="40" y="110" width="490" height="120" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="62" y="142" fill="#38bdf8" font-size="20" font-weight="700">User A • local reaction: 0.2 seconds</text>
  <text x="62" y="171" fill="#cbd5e1" font-size="17">Loads late; button first available at t = 1.8s.</text>
  <text x="62" y="196" fill="#cbd5e1" font-size="17">Press at 2.0s → Firestore commit at 2.2s.</text>
  <text x="62" y="221" fill="#cbd5e1" font-size="17">Fresh input is allowed after B starts collection.</text>
  <rect x="550" y="110" width="510" height="120" rx="14" fill="#1e293b" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="572" y="142" fill="#c4b5fd" font-size="20" font-weight="700">User B • local reaction: 1.0 second</text>
  <text x="572" y="171" fill="#cbd5e1" font-size="17">Button available at t = 0; press at 1.0s.</text>
  <text x="572" y="196" fill="#cbd5e1" font-size="17">First commit at 1.2s starts collection.</text>
  <text x="572" y="221" fill="#cbd5e1" font-size="17">The strict server deadline is t = 3.2s.</text>
  <rect x="440" y="265" width="400" height="260" rx="10" fill="#334155" opacity="0.6"/>
  <text x="462" y="290" fill="#e2e8f0" font-size="18" font-weight="700">Server collection: commits before 3.2s</text>
  <rect x="560" y="311" width="80" height="65" rx="8" fill="#0c4a6e"/>
  <rect x="640" y="311" width="120" height="65" rx="8" fill="none" stroke="#7dd3fc" stroke-dasharray="4 5"/>
  <text x="569" y="335" fill="#7dd3fc" font-size="16">Grace limit: 2.8s</text>
  <line x1="200" y1="302" x2="200" y2="525" stroke="#64748b" stroke-dasharray="4 5"/>
  <text x="194" y="552" fill="#94a3b8" font-size="16">0</text>
  <line x1="400" y1="302" x2="400" y2="525" stroke="#64748b" stroke-dasharray="4 5"/>
  <text x="394" y="552" fill="#94a3b8" font-size="16">1</text>
  <line x1="440" y1="302" x2="440" y2="525" stroke="#64748b" stroke-dasharray="4 5"/>
  <text x="426" y="552" fill="#94a3b8" font-size="16">1.2</text>
  <line x1="560" y1="302" x2="560" y2="525" stroke="#64748b" stroke-dasharray="4 5"/>
  <text x="546" y="552" fill="#94a3b8" font-size="16">1.8</text>
  <line x1="600" y1="302" x2="600" y2="525" stroke="#64748b" stroke-dasharray="4 5"/>
  <text x="594" y="552" fill="#94a3b8" font-size="16">2</text>
  <line x1="640" y1="302" x2="640" y2="525" stroke="#64748b" stroke-dasharray="4 5"/>
  <text x="626" y="552" fill="#94a3b8" font-size="16">2.2</text>
  <line x1="760" y1="302" x2="760" y2="525" stroke="#64748b" stroke-dasharray="4 5"/>
  <text x="746" y="552" fill="#94a3b8" font-size="16">2.8</text>
  <line x1="840" y1="302" x2="840" y2="525" stroke="#64748b" stroke-dasharray="4 5"/>
  <text x="826" y="552" fill="#94a3b8" font-size="16">3.2</text>
  <line x1="1000" y1="302" x2="1000" y2="525" stroke="#64748b" stroke-dasharray="4 5"/>
  <text x="994" y="552" fill="#94a3b8" font-size="16">4</text>
  <text x="40" y="356" fill="#38bdf8" font-size="20" font-weight="700">User A</text>
  <line x1="200" y1="365" x2="1020" y2="365" stroke="#64748b" stroke-width="2"/>
  <circle cx="560" cy="365" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="600" cy="365" r="7" fill="#38bdf8"/>
  <circle cx="640" cy="365" r="7" fill="#34d399"/>
  <text x="486" y="396" fill="#7dd3fc" font-size="16">Unlock 1.8s</text>
  <text x="575" y="419" fill="#38bdf8" font-size="16">Press 2.0s</text>
  <text x="648" y="385" fill="#34d399" font-size="16">Commit 2.2s</text>
  <text x="648" y="406" fill="#34d399" font-size="16">Input ends</text>
  <text x="40" y="461" fill="#c4b5fd" font-size="20" font-weight="700">User B</text>
  <line x1="200" y1="470" x2="1020" y2="470" stroke="#64748b" stroke-width="2"/>
  <circle cx="200" cy="470" r="7" fill="#0f172a" stroke="#c4b5fd" stroke-width="2"/>
  <circle cx="400" cy="470" r="7" fill="#c4b5fd"/>
  <circle cx="440" cy="470" r="7" fill="#34d399"/>
  <text x="183" y="502" fill="#c4b5fd" font-size="16">Unlock 0s</text>
  <text x="321" y="449" fill="#c4b5fd" font-size="16">Press 1.0s</text>
  <text x="455" y="502" fill="#34d399" font-size="16">Commit 1.2s</text>
  <line x1="840" y1="302" x2="840" y2="525" stroke="#fda4af" stroke-width="3"/>
  <text x="765" y="580" fill="#fda4af" font-size="17" font-weight="700">Strict deadline</text>
  <text x="1004" y="580" fill="#94a3b8" font-size="17">t (s)</text>
  <rect x="40" y="605" width="1020" height="120" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="62" y="637" fill="#34d399" font-size="20" font-weight="700">After 3.2s: the host finalizes → User A wins</text>
  <text x="62" y="666" fill="#cbd5e1" font-size="17">Both submissions committed before the deadline. A’s 0.2s reaction is faster than B’s 1.0s.</text>
  <text x="62" y="691" fill="#cbd5e1" font-size="17">B receives a 0.8s reaction-gap notice. No estimated network latency is subtracted.</text>
  <text x="62" y="716" fill="#cbd5e1" font-size="17">The winner, history, and recap are written together; winner announcement ends all input.</text>
  <rect x="40" y="755" width="1020" height="195" rx="14" fill="#1e293b" stroke="#fda4af" stroke-width="1.5"/>
  <text x="62" y="787" fill="#fda4af" font-size="20" font-weight="700">If A unlocks even later: local grace cannot extend server acceptance</text>
  <text x="62" y="816" fill="#cbd5e1" font-size="17">Alternative: A first becomes available at 2.8s → local grace would last until 3.8s.</text>
  <text x="62" y="841" fill="#cbd5e1" font-size="17">Without a winner announcement, A can still press during that grace.</text>
  <text x="62" y="866" fill="#cbd5e1" font-size="17">A commit at / after 3.2s is rejected: “Your buzz arrived after the collection window closed.”</text>
  <text x="62" y="891" fill="#cbd5e1" font-size="17">A winner announced at 3.3s immediately stops grace; B wins if A has no accepted submission.</text>
  <text x="62" y="916" fill="#cbd5e1" font-size="17">A rejected press receives no reaction comparison and changes no attempts, history, recap, or scores.</text>
  <text x="62" y="941" fill="#cbd5e1" font-size="17">Refresh restores the existing origin; it does not start a new grace period.</text>
  <text x="40" y="986" fill="#94a3b8" font-size="17">Still locked during collection? Wait for personal unlock; collection does not create early-buzz penalties.</text>
</g>
</svg>
