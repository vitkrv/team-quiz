<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1020" viewBox="0 0 1100 1020" role="img" aria-labelledby="title desc"><title id="title">Buzz winner selection flow</title><desc id="desc">After an initial unlock delay, eligible contestants submit local reaction durations. The first server commit starts a two-second collection window. The host ranks accepted submissions by reaction duration, then acceptance timestamp, then player ID, and announces the winner.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#94a3b8"/></marker></defs><rect width="1100" height="1020" rx="20" fill="#0f172a"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="48" fill="#f8fafc" font-size="30" font-weight="700">How the Buzz winner is selected</text><text x="40" y="78" fill="#cbd5e1" font-size="17" font-weight="400">Ordinary questions • buzzer policy v1</text><rect x="40" y="110" width="640" height="100" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="62" y="142" fill="#38bdf8" font-size="20" font-weight="700">1  Open the race</text><text x="62" y="171" fill="#cbd5e1" font-size="17" font-weight="400">Wait 2 seconds; each eligible player gets a local reaction origin.</text><text x="62" y="196" fill="#cbd5e1" font-size="17" font-weight="400">A competitive early press adds a fixed 2.5-second personal delay.</text><path d="M360 210 L360 237" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="240" width="640" height="100" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="62" y="272" fill="#38bdf8" font-size="20" font-weight="700">2  Capture an eligible press</text><text x="62" y="301" fill="#cbd5e1" font-size="17" font-weight="400">Reaction = press time − local button availability time.</text><text x="62" y="326" fill="#cbd5e1" font-size="17" font-weight="400">Capture once; network travel and retries do not change it.</text><path d="M360 340 L360 367" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="370" width="640" height="120" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="62" y="402" fill="#38bdf8" font-size="20" font-weight="700">3  Commit the first accepted submission</text><text x="62" y="431" fill="#cbd5e1" font-size="17" font-weight="400">Firestore records the first acceptance time: T.</text><text x="62" y="456" fill="#cbd5e1" font-size="17" font-weight="400">Collection deadline = T + 2 seconds.</text><text x="62" y="481" fill="#cbd5e1" font-size="17" font-weight="400">No provisional winner is announced.</text><path d="M360 490 L360 517" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="520" width="640" height="120" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="62" y="552" fill="#38bdf8" font-size="20" font-weight="700">4  Collect accepted submissions</text><text x="62" y="581" fill="#cbd5e1" font-size="17" font-weight="400">Clients close input as soon as they observe collection.</text><text x="62" y="606" fill="#cbd5e1" font-size="17" font-weight="400">Already captured presses may still commit strictly before T + 2s.</text><text x="62" y="631" fill="#cbd5e1" font-size="17" font-weight="400">One immutable submission per eligible contestant.</text><path d="M360 640 L360 667" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="670" width="640" height="145" rx="14" fill="#1e293b" stroke="#c4b5fd" stroke-width="1.5"/><text x="62" y="702" fill="#c4b5fd" font-size="20" font-weight="700">5  Host finalizes after the deadline</text><text x="62" y="731" fill="#cbd5e1" font-size="17" font-weight="400">Order committed submissions by:</text><text x="62" y="756" fill="#cbd5e1" font-size="17" font-weight="400">1. Smallest reported reaction duration</text><text x="62" y="781" fill="#cbd5e1" font-size="17" font-weight="400">2. Earliest acceptance timestamp   3. Stable player ID</text><path d="M360 815 L360 842" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="845" width="640" height="100" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/><text x="62" y="877" fill="#34d399" font-size="20" font-weight="700">6  Announce the winner</text><text x="62" y="906" fill="#cbd5e1" font-size="17" font-weight="400">Write winner, history, and recap atomically.</text><text x="62" y="931" fill="#cbd5e1" font-size="17" font-weight="400">Start the 10-second visual answer timer; host judges the answer.</text><rect x="725" y="110" width="335" height="125" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/><text x="747" y="142" fill="#94a3b8" font-size="20" font-weight="700">Personal reaction origin</text><text x="747" y="171" fill="#cbd5e1" font-size="17" font-weight="400">Penalty time is not added</text><text x="747" y="196" fill="#cbd5e1" font-size="17" font-weight="400">to the ranking duration.</text><text x="747" y="221" fill="#cbd5e1" font-size="17" font-weight="400">Refresh restores the origin.</text><rect x="725" y="370" width="335" height="145" rx="14" fill="#1e293b" stroke="#fda4af" stroke-width="1.5"/><text x="747" y="402" fill="#fda4af" font-size="20" font-weight="700">Acceptance is a commit</text><text x="747" y="431" fill="#cbd5e1" font-size="17" font-weight="400">Not initial network arrival.</text><text x="747" y="456" fill="#cbd5e1" font-size="17" font-weight="400">At / after the deadline: rejected.</text><text x="747" y="481" fill="#cbd5e1" font-size="17" font-weight="400">A rejected press cannot change</text><text x="747" y="506" fill="#cbd5e1" font-size="17" font-weight="400">the result or recap.</text><rect x="725" y="555" width="335" height="120" rx="14" fill="#1e293b" stroke="#c4b5fd" stroke-width="1.5"/><text x="747" y="587" fill="#c4b5fd" font-size="20" font-weight="700">Host unavailable?</text><text x="747" y="616" fill="#cbd5e1" font-size="17" font-weight="400">Wait for the host to reconnect.</text><text x="747" y="641" fill="#cbd5e1" font-size="17" font-weight="400">The deadline stays fixed.</text><text x="747" y="666" fill="#cbd5e1" font-size="17" font-weight="400">Final delivery can take longer.</text><rect x="725" y="715" width="335" height="145" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/><text x="747" y="747" fill="#94a3b8" font-size="20" font-weight="700">Race interrupted?</text><text x="747" y="776" fill="#cbd5e1" font-size="17" font-weight="400">Reveal, question change, or</text><text x="747" y="801" fill="#cbd5e1" font-size="17" font-weight="400">finish cancels an unresolved race.</text><text x="747" y="826" fill="#cbd5e1" font-size="17" font-weight="400">Wrong answer: a fresh race,</text><text x="747" y="851" fill="#cbd5e1" font-size="17" font-weight="400">without a new opening delay.</text><text x="40" y="987" fill="#94a3b8" font-size="18" font-weight="400">Trust boundary: device reaction measurements and host ranking are trusted.</text></g></svg>
